name: Validate algebra and numerics
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Preflight compile + import contracts
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test_import_contracts.py' -v
      - run: python -m src.symbolic_verify
      - run: python -m src.exact_counterexample
      - run: python -m src.two_t_frontier_certificate
      - run: python -m src.general_phase_certificate
      - run: python -m src.two_t_isomagic_counterexample
      - run: python -m src.local_clifford_frontier
      - run: python -m src.one_cnot_saturation
      - run: python -m src.intrinsic_isomagic_separation
      - run: python -m src.one_cnot_universality
      - run: python -m src.three_t_prelocalization
      - run: python -m src.three_t_exact_gap
      - run: python -m src.three_t_two_cnot_compiler
      - run: python -m src.three_t_symplectic_obstruction
      - run: python -m src.three_t_parametric_certificate
      - run: python -m src.three_t_exact_branch_frontier
      - run: python -m src.three_t_simple_state_certificate
      - run: python -m src.maximal_magic_orbit_certificate
      - run: python -m src.three_t_exact_maximal_magic
      - run: python -m src.input_preparation_cost
      - run: python -m src.one_t_natural_input_theorem
      - run: python -m src.two_t_prepared_no_go
      - run: python -m src.three_t_prepared_threshold
      - run: python -m unittest discover -s tests -v
